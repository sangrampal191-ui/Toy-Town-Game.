<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Town Game</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #87ceeb;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: linear-gradient(#87ceeb 0%, #bfe9ff 55%, #6fcf5f 55%, #4caf50 100%);
    }

    .title {
      position: absolute;
      top: 18px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #333;
    }

    #score {
      position: absolute;
      top: 70px;
      left: 20px;
      background: white;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: bold;
    }

    #player {
      position: absolute;
      width: 55px;
      height: 70px;
      left: 45%;
      bottom: 60px;
    }

    .head {
      width: 38px;
      height: 38px;
      background: #ffd2a6;
      border-radius: 50%;
      margin: auto;
      border: 2px solid #333;
    }

    .body {
      width: 46px;
      height: 35px;
      background: #ff5252;
      margin: -2px auto;
      border-radius: 12px 12px 5px 5px;
      border: 2px solid #333;
    }

    .toy {
      position: absolute;
      width: 48px;
      height: 48px;
      background: #ffd43b;
      border: 3px solid #333;
      border-radius: 50%;
    }

    .toy::after {
      content: "★";
      font-size: 30px;
      position: absolute;
      left: 7px;
      top: 3px;
      color: #ff7043;
    }

    .controls {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
    }

    button {
      border: none;
      border-radius: 50%;
      width: 58px;
      height: 58px;
      margin: 5px;
      font-size: 24px;
      background: white;
    }
  </style>
</head>

<body>
  <div id="game">
    <div class="title">TOY TOWN</div>
    <div id="score">⭐ Battery Cores: 0</div>

    <div id="player">
      <div class="head"></div>
      <div class="body"></div>
    </div>

    <div class="controls">
      <button onclick="movePlayer(-25)">⬅️</button>
      <button onclick="movePlayer(25)">➡️</button>
    </div>
  </div>

  <script>
    let score = 0;
    let playerX = window.innerWidth * 0.45;

    const player = document.getElementById("player");
    const scoreText = document.getElementById("score");
    const game = document.getElementById("game");

    function movePlayer(amount) {
      playerX += amount;
      playerX = Math.max(0, Math.min(window.innerWidth - 60, playerX));
      player.style.left = playerX + "px";
    }

    function createToy() {
      const toy = document.createElement("div");
      toy.className = "toy";

      toy.style.left = Math.random() * (window.innerWidth - 60) + "px";
      toy.style.top = 150 + Math.random() * (window.innerHeight - 300) + "px";

      toy.onclick = function() {
        score++;
        scoreText.innerHTML = "⭐ Battery Cores: " + score;
        toy.remove();
        setTimeout(createToy, 500);
      };

      game.appendChild(toy);
    }

    for (let i = 0; i < 5; i++) createToy();
  </script>
</body>
</html>
